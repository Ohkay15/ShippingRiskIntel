services:
  postgres:
    image: postgres:17-alpine
    container_name: shipping-risk-intel-db
    environment:
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping
      POSTGRES_DB: shipping_risk_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shipping_risk_intel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
